<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control Group Admin | KMUTT</title><link rel="stylesheet" href="/src/styles.css"></head>
<body class="admin-body">
<div class="admin-shell">
  <aside class="sidebar"><a class="brand" href="/"><span class="brand-logo">C</span><span><b>Control Group</b><small>ADMIN</small></span></a>
    <button data-page="dashboard" class="side active">Dashboard</button><button data-page="researchers" class="side">Researchers</button>
    <button data-page="students" class="side">Students</button><button data-page="publications" class="side">Publications</button>
    <button data-page="theses" class="side">Theses</button><button data-page="projects" class="side">Projects</button>
    <button data-page="news" class="side">News</button><button data-page="gallery" class="side">Gallery</button>
    <a class="side" href="/">← Public website</a><button id="logout" class="side danger">Sign out</button>
  </aside>
  <main class="admin-main">
    <div id="loginPanel" class="login-card"><p class="eyebrow">RESTRICTED AREA</p><h1>Research Group Admin</h1><p>Sign in to manage the research archive.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login" class="btn primary full">Sign in</button><p id="loginMsg" class="form-msg"></p></div>
    <div id="adminPanel" hidden>
      <div class="admin-head"><div><p class="eyebrow">CONTENT MANAGEMENT</p><h1 id="pageTitle">Dashboard</h1></div><button id="newRecord" class="btn primary">+ New record</button></div>
      <div id="adminContent"></div>
    </div>
  </main>
</div>
<script type="module" src="/src/admin.js"></script>
</body></html>
